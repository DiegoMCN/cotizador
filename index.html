<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cotiza tu app de seguimiento nutricional</title>
  <meta name="description" content="Elige los módulos de tu app de seguimiento nutricional y entrenamiento, ve el precio y las fases en tiempo real y descarga tu cotización en PDF.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#B3155F">
  <link rel="preload" href="fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/hanken-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#view">Saltar al contenido</a>

  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <p class="brand-name">Cotización</p>
        <p class="brand-sub" id="brandSub"></p>
      </div>
      <ol class="steps" id="steps" aria-label="Pasos de la cotización"></ol>
    </div>
  </header>

  <main class="layout" id="layout">
    <div class="view" id="view" tabindex="-1"></div>
    <aside class="aside" id="aside" aria-label="Tu cotización en vivo"></aside>
  </main>

  <div class="bar" id="bar" hidden>
    <button class="bar-sum" id="barSum" type="button" aria-haspopup="dialog">
      <span class="bar-label">Inversión estimada</span>
      <span class="bar-total" id="barTotal" aria-live="polite" aria-atomic="true">$0</span>
      <span class="bar-support" id="barSupport"></span>
    </button>
    <button class="btn btn-primary bar-go" id="barGo" type="button" data-action="next">Continuar</button>
  </div>

  <dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle">Tu cotización</h2>
      <button class="icon-btn" type="button" data-action="close-sheet" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">Este cotizador necesita JavaScript para funcionar. Actívalo en tu navegador e intenta de nuevo.</p></noscript>

  <script src="vendor/jspdf.umd.min.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/catalog.js" defer></script>
  <script src="js/engine.js" defer></script>
  <script src="js/pdf.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
